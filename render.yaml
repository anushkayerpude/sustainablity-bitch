services:
  - type: web
    name: labsync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DB_PATH
        value: /app/data/labsync.db
